name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile
        run: python -m py_compile global/nomad/bin/py/*.py
      - name: unittest
        run: python -m unittest discover -s tests -v
